[project]
name = "sentinel-ai"
version = "2.0.0"
description = "A discipline layer for Claude Code sessions: the right message at the right moment, exact checks in code, state in files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Chimera Labs" }]
dependencies = []

[project.scripts]
sentinel = "sentinel.cli:main"
sentinel-hook = "sentinel.hook:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
